<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InventarioPro</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header></header>

<main>

    <section class="buscador-wrapper" role="search" aria-label="Buscar artículos en el inventario">
        <div class="buscador-glow">
            <div class="buscador-input-contenedor">
                <svg
                    class="buscador-icono"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input
                    type="text"
                    id="inputBusqueda"
                    class="buscador-input"
                    aria-label="Buscar artículos por nombre, ID, categoría o patrimonio"
                    autocomplete="off"
                    spellcheck="false"
                >
            </div>
        </div>
        <p id="buscadorInfo" class="buscador-info" aria-live="polite"></p>
    </section>

    <div id="contenedor"></div>

</main>

<footer></footer>

<script src="js/Config.js"></script>
<script src="js/services/ApiService.js"></script>
<script src="js/services/ArticulosService.js"></script>
<script src="js/script.js"></script>

</body>

</html>
